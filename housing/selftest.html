<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linguics — engine self-test</title>
<!--
  ENGINE SELF-TEST (Housing, 2026-08-03)

  Every case here exists because something broke SILENTLY. That is this estate's
  characteristic failure: not a crash, but a feature that quietly stops doing its
  job while every surface still renders. In one session we found a three-
  apostrophe escape that had never once worked, a scroll helper that no-oped on
  every mark, a spelling deck that had never served 17 delivered items, a
  lemmatiser inventing vocabulary buckets for words that were not in the
  sentence, and a marker running at temperature 1.0. None raised an error.

  So each test below names the fault it protects against. A test that cannot say
  what regression it catches does not belong here.

  Runs against the REAL engine modules and the REAL content, served from the
  site. Open /housing/selftest.html.
-->
<style>
  :root { --cream:#fdfaf4; --ink:#2b2b2b; --navy:#3a4f8a; --rule:#e2dbcc;
          --green:#2e7d4f; --red:#a33a3a; --muted:#7a7268; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--cream); color:var(--ink);
         font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
         font-size:16px; line-height:1.5; }
  h1 { font-size:24px; margin:0 0 4px; color:var(--navy); font-weight:600; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:18px; }
  #summary { font-size:19px; font-weight:600; margin:0 0 16px; padding:12px 16px;
             border-radius:6px; border:1px solid var(--rule); background:#fff; }
  .grp { background:#fff; border:1px solid var(--rule); border-radius:6px;
         padding:14px 16px; margin-bottom:12px; }
  .grp h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
            color:var(--muted); margin:0 0 10px; font-weight:600; }
  .t { display:flex; gap:10px; align-items:baseline; padding:5px 0;
       border-bottom:1px solid #f0ebdd; font-size:14px; }
  .t:last-child { border-bottom:none; }
  .badge { flex:0 0 auto; font-size:11px; font-weight:700; letter-spacing:.05em;
           padding:2px 7px; border-radius:3px; }
  .pass .badge { background:#e9f6ee; color:var(--green); }
  .fail .badge { background:#fdecec; color:var(--red); }
  .skip .badge { background:#f3efe2; color:var(--muted); }
  .t .what { flex:1 1 auto; }
  .t .guards { display:block; font-size:12px; color:var(--muted); font-style:italic; }
  .t .got { display:block; font-size:12.5px; color:var(--red); font-family:ui-monospace,Menlo,Consolas,monospace; }
</style>
</head>
<body>

<h1>Engine self-test</h1>
<div class="sub">Every case names the silent fault it protects against. Runs against the real modules and the real content.</div>
<div id="summary">Loading content…</div>
<div id="out"></div>

<script src="js/norm.js?v=2026-08-05-r134"></script>
<script src="js/store.js?v=2026-08-05-r134"></script>
<script src="js/engine_axes.js?v=2026-08-05-r134"></script>
<script src="js/grammar_engine.js?v=2026-08-05-r134"></script>
<script src="js/translation_stub.js?v=2026-08-05-r134"></script>
<script src="js/translation_marker.js?v=2026-08-05-r134"></script>
<script>
(function () {
  "use strict";
  const LL = window.LL;
  const results = [];
  const group = (name) => ({ name, tests: [] });
  const groups = [];

  function T(g, what, guards, fn) {
    let state = "pass", got = "";
    try {
      const r = fn();
      if (r === true || r === undefined) state = "pass";
      else if (r === null) { state = "skip"; got = "not loaded"; }
      else { state = "fail"; got = String(r); }
    } catch (e) {
      state = "fail"; got = (e && e.message) ? e.message : String(e);
    }
    g.tests.push({ what, guards, state, got });
    results.push(state);
  }

  async function jget(p) {
    const r = await fetch(p, { cache: "no-store" });
    if (!r.ok) throw new Error(p + " HTTP " + r.status);
    return JSON.parse((await r.text()).replace(/[\x00\r\n\s]+$/, ""));
  }

  function eq(a, b) { return (a === b) ? true : ("got " + JSON.stringify(a) + ", expected " + JSON.stringify(b)); }

  async function run() {
    // ---------------------------------------------------------------- data
    let vocab = null, menu = null, surface = null, tense = null, accent = null, manifest = null;
    let cssText = "";
    let appText = "";
    // app.js is deliberately NOT loaded on this page (it boots the whole UI),
    // so the two source-level contracts below are checked by reading it.
    try { const cr = await fetch("css/style.css", { cache: "no-store" }); if (cr.ok) cssText = await cr.text(); } catch (e) { cssText = ""; }
    try { const ar = await fetch("js/app.js", { cache: "no-store" }); if (ar.ok) appText = await ar.text(); } catch (e) { appText = ""; }
    try {
      [manifest, vocab, menu, surface, tense, accent] = await Promise.all([
        jget("../data/manifest.json"),
        jget("../data/vocabulary_it_frequency.json"),
        jget("../data/translation_marker_bucket_menu.json"),
        jget("../data/it_surface_to_lemma.json"),
        jget("../data/it_verb_tense_forms.json"),
        jget("../data/grammar_questions_accent.json")
      ]);
    } catch (e) {
      document.getElementById("summary").textContent = "Could not load content: " + e.message
        + " — this page must be SERVED, not opened off disk.";
      return;
    }
    LL.vocabEntries = vocab; LL.markerMenu = menu;
    LL.surfaceToLemma = surface; LL.verbTenseForms = tense;

    // -------------------------------------------------- accent input layer
    const g1 = group("Apostrophe input (norm.js)"); groups.push(g1);
    // the rewriter fires per keystroke, so anything one-shot hides the bug
    const type = (keys) => { let b = ""; for (const k of keys) b = LL.normaliseAccentInput(b + k); return b; };
    T(g1, "one apostrophe gives a grave", "—", () => eq(type("e'"), "è"));
    T(g1, "two give an acute", "—", () => eq(type("e''"), "é"));
    T(g1, "THREE give a literal apostrophe",
      "this escape existed in the file for weeks and never once worked: the rule list ran in order and a later rule undid it in the same pass",
      () => eq(type("e'''"), "e'"));
    T(g1, "un po with three apostrophes survives",
      "po' was absent from the old apocope allow-list, so it was silently corrupted into the exact error the accent drill teaches against",
      () => eq(type("un po'''"), "un po'"));
    T(g1, "da with one apostrophe gives the indicative",
      "the old allow-list reserved da' for the imperative, so the commoner da-grave could not be typed at all",
      () => eq(type("da'"), "dà"));
    T(g1, "elisions are untouched",
      "apostrophes after a consonant must never be treated as accent input",
      () => eq(LL.normaliseAccentInput("dell'anno"), "dell'anno"));

    // ------------------------------------------------ marker bucket context
    const g2 = group("Marker bucket context (translation_marker.js)"); groups.push(g2);
    let items = [];
    for (const t of manifest.topics) {
      try { for (const it of await jget("../data/translation_items_" + t + ".json")) items.push(it); }
      catch (e) {}
    }
    const byId = {};
    for (const t of manifest.topics) {
      try { for (const b of await jget("../data/buckets/" + t + ".json")) byId[b.id] = b; }
      catch (e) {}
    }
    const itEn = items.find(i => LL.inferDirection(i) === "it_en" && /ore/.test(i.source_text || ""))
              || items.find(i => LL.inferDirection(i) === "it_en");
    T(g2, "it_en vocab injection lemmatises properly",
      "a 3-character-stem heuristic turned 'ore' into orecchio (ear) and 'problemi' into proprio, writing vocabulary events for words that were never in the sentence",
      () => {
        if (!itEn) return null;
        const ctx = LL.buildBucketContext(itEn, byId, { menuMode: "none" });
        const lem = new Set(vocab.filter(e => e && e.lemma).map(e => String(e.lemma).toLowerCase()));
        const bad = Object.keys(ctx).filter(k => k.indexOf("vocabulary.it.") === 0)
          .map(k => k.split(".")[2]).filter(l => !lem.has(l));
        return bad.length ? ("phantom lemmas: " + bad.join(", ")) : true;
      });
    T(g2, "menu modes change the payload size",
      "the 581-bucket menu at ~48k tokens is the leading suspect for breadth marking collapsing; the modes must actually differ",
      () => {
        if (!itEn) return null;
        const full = Object.keys(LL.buildBucketContext(itEn, byId, { menuMode: "full" })).length;
        const agg = Object.keys(LL.buildBucketContext(itEn, byId, { menuMode: "aggregates" })).length;
        return full > agg ? true : ("full=" + full + " aggregates=" + agg);
      });
    T(g2, "the item's own floor survives every menu mode",
      "the required_buckets are the mandatory floor; a menu change must never drop them",
      () => {
        for (const it of items.slice(0, 200)) {
          for (const mode of ["full", "labels", "aggregates", "agg_labels", "retrieved", "none"]) {
            const ctx = LL.buildBucketContext(it, byId, { menuMode: mode });
            for (const f of (it.required_buckets || [])) {
              if (!byId[f]) continue;                       // unregistered: separate check
              if (!LL.isCandidateForDirection(f, LL.inferDirection(it))) continue;  // direction filter
              if (!ctx[f]) return it.external_id + " lost " + f + " in " + mode;
            }
          }
        }
        return true;
      });

    // ------------------------------------------------------- accent scoring
    const g3 = group("Accent drill outcome + docking (app.js contract)"); groups.push(g3);
    // These two originally asserted the DATA (every distractor carries a
    // choice_tags class) and failed 158 times. That was the wrong invariant:
    // what matters is that every distractor resolves to a class that was
    // DERIVED, by tag or by diff or by recognising a judgement item - never a
    // silent default. Rewritten to test that, which is what caught the bug.
    T(g3, "every distractor resolves to a derived outcome class",
      "158 judgement distractors (Correct/Incorrect) had no accent difference to diff, so they fell onto the wrong_kind DEFAULT: recorded on a leaf none of them belongs to, and paid 0.8 for a two-way guess once docking landed",
      () => {
        let byDefault = 0;
        for (const q of accent) {
          if (!Array.isArray(q.choices)) continue;
          for (let i = 0; i < q.choices.length; i++) {
            if (i === q.answer_index) continue;
            const tag = (q.choice_tags || [])[i];
            if (tag && tag.class) continue;                        // derived from the tag
            if (LL.accentDiff(q.choices[q.answer_index], q.choices[i])) continue;  // derived from the diff
            const cls = LL.accentOutcomeClass(q, i, false);
            if (cls === "judgement") continue;                     // derived from the choice shape
            byDefault++;
          }
        }
        return byDefault === 0 ? true : (byDefault + " distractors classified by default, not derivation");
      });
    T(g3, "a judgement miss scores zero, not a docked partial",
      "the docking scale grades the severity of a PRODUCED accent error; a binary right-or-wrong question has no severity to grade, and 0.8 for a coin-flip would be the tail wagging the dog",
      () => {
        const q = accent.find(x => Array.isArray(x.choices)
          && x.choices.every(c => /^(in)?correct$/i.test(String(c).trim())));
        if (!q) return null;
        const wrong = (q.answer_index === 0) ? 1 : 0;
        const base = { markpoints: (q.markpoints || []).map(mp => ({ bucket: mp.bucket, credit_weight: 1,
                        attempted_credit: 1, correctness_credit: 0, outcome: "miss" })),
                       overall: { marks_awarded: 0, marks_possible: 1, correctness_overall: 0,
                                  status: "miss", summary: "Wrong" } };
        const r = LL.applyAccentAxes(q, wrong, base);
        return r.overall.marks_awarded === 0 ? true
          : ("a wrong judgement scored " + r.overall.marks_awarded);
      });

    // --------------------------------------------------- chosen-tense axis
    const g4 = group("Chosen-tense inference (Canvas A6 axis)"); groups.push(g4);
    const ct = (a, c) => LL.inferChosenTense(a, c);
    T(g4, "a simple form resolves", "—", () => eq(ct("ero", ["imperfect", "passato_prossimo"]), "imperfect"));
    T(g4, "a compound resolves from its auxiliary",
      "the tense of a compound lives in the auxiliary, not the participle",
      () => eq(ct("ho mangiato", ["present", "passato_prossimo"]), "passato_prossimo"));
    T(g4, "compounds work for verbs outside the cued set",
      "the form table only covers the cued verbs, so participles are matched by ending or every other verb silently fails",
      () => eq(ct("avevo parlato", ["imperfect", "trapassato_prossimo"]), "trapassato_prossimo"));
    T(g4, "accent-free typing still resolves",
      "learners type without accents; a strict lookup would return null for most real answers",
      () => eq(ct("c e stato", ["imperfect", "passato_prossimo"]), "passato_prossimo"));
    T(g4, "an unresolvable answer returns null, not a guess",
      "a wrong guess writes a false confusion into the matrix, which is worse than a gap in it",
      () => eq(ct("qwertyuiop", ["imperfect", "passato_prossimo"]), null));

    // ------------------------------------------------- grammar marker rules
    // The substring marker decides whether a learner is right. Every
    // false-credit bug this estate has had came from one of these four
    // behaviours being forgotten, so they are pinned here.
    const g4b = group("Grammar marker semantics (grammar_engine.js)"); groups.push(g4b);
    const two = (mp) => ({ markpoints: [mp, { bucket: "filler", any_phrases: ["zzz"] }], marks: 1 });
    const outcome = (q, ans) => LL.markGrammar(q, ans).markpoints[0].outcome;
    T(g4b, "a positive any_phrases match BEATS must_not_include",
      "the guard is else-if gated: a correct string nested inside a wrong one is credited and the guard never runs. This is why an additive error cannot be caught by must_not_include and needs a widened phrase or an index-scored item instead",
      () => eq(outcome(two({ bucket: "b", any_phrases: ["ho"], must_not_include: ["ho fatto"] }), "ho fatto"), "hit"));
    T(g4b, "a markpoint-level match_at is honoured",
      "it used to be silently ignored - 64 markpoints across 32 passato-prossimo items carried one, so 'ho parlatoo' and even 'hoparlato' scored full marks because the correct string sits inside the wrong one",
      () => eq(outcome(two({ bucket: "b", any_phrases: ["sta"], match_at: "word" }), "stava"), "miss"));
    T(g4b, "a per-phrase match_at still wins over the markpoint default",
      "per-phrase anchoring is the documented mechanism and 2,569 markpoints rely on it; the new default must never override it",
      () => eq(outcome(two({ bucket: "b", match_at: "start",
                             any_phrases: [{ phrase: "sta", match_at: "word" }] }), "stava"), "miss"));
    T(g4b, "the residue engine fires on single-markpoint items only",
      "an extra word zeroes a single-markpoint item; on a multi-markpoint item it must not, or every partially-right answer collapses",
      () => {
        const one = { markpoints: [{ bucket: "b", any_phrases: ["nero"] }], marks: 1 };
        const a = LL.markGrammar(one, "gatti nero").markpoints[0].outcome;
        const b = outcome(two({ bucket: "b", any_phrases: ["nero"] }), "gatti nero");
        return (a === "miss" && b === "hit") ? true : ("single=" + a + " multi=" + b);
      });
    T(g4b, "residue does not punish words the PROMPT supplied",
      "the learner echoing the prompt is not an extraneous word; counting it would zero honest answers",
      () => eq(LL.markGrammar({ prompt: "I gatti sono ____ .",
        markpoints: [{ bucket: "b", any_phrases: ["neri"] }], marks: 1 }, "gatti neri")
        .markpoints[0].outcome, "hit"));
    T(g4b, "residue does not wipe the ACCENT-FOLD rescue",
      "the fold rescue credits a docked partial and pushes an orthography slip; the residue block then re-subtracted the phrase STRICTLY, so on an accent-off answer the accented phrase was not found, its words survived as residue and the credit was zeroed. 174 single-markpoint items estate-wide scored a flat MISS for a missing accent, while the pulse still recorded the slip",
      () => {
        const r = LL.markGrammar({ markpoints: [{ bucket: "b", any_phrases: ["pi\u00f9 alto di"] }], marks: 1 }, "piu alto di");
        const m = r.markpoints[0];
        return (m.outcome === "partial" && m.correctness_credit > 0 && !m.residue)
          ? true : ("outcome=" + m.outcome + " credit=" + m.correctness_credit + " residue=" + JSON.stringify(m.residue || null));
      });
    T(g4b, "residue still fires on genuine junk in an accent-off answer",
      "the fold-aware subtraction must not become a blanket amnesty: a real extraneous word survives folding and must still zero the item, or the residue engine's own target is lost",
      () => {
        const m = LL.markGrammar({ markpoints: [{ bucket: "b", any_phrases: ["pi\u00f9 alto di"] }], marks: 1 }, "piu alto di zanzarone").markpoints[0];
        return (m.outcome === "miss" && Array.isArray(m.residue) && m.residue.indexOf("zanzarone") >= 0)
          ? true : ("outcome=" + m.outcome + " residue=" + JSON.stringify(m.residue || null));
      });
    T(g4b, "residue subtracts PROMPT words that carry punctuation",
      "norm only strips ?.,;:! before a space or end, so a prompt closing \"...?'\" or a cue in (parentheses) left its words punctuated and they never subtracted. A learner writing the full sentence was zeroed: 1,093 of 2,037 blank-filling items fired a false residue before the fix",
      () => {
        const q = { prompt: "Complete: 'I tuoi ____ sono italiani?' (amico)",
                    markpoints: [{ bucket: "b", any_phrases: ["amici"] }], marks: 1 };
        const m = LL.markGrammar(q, "I tuoi amici sono italiani? (amico)").markpoints[0];
        return (m.outcome === "hit" && !m.residue) ? true : ("outcome=" + m.outcome + " residue=" + JSON.stringify(m.residue || null));
      });
    T(g4b, "norm folds the apostrophe and the hyphen to a space",
      "un'amica and un amica must compare equal, and ex-marito to ex marito; authors rely on it and it silently breaks short-fragment anchoring if it changes",
      () => (LL.norm("un'amica") === "un amica" && LL.norm("ex-marito") === "ex marito")
        ? true : ("apostrophe -> " + LL.norm("un'amica") + ", hyphen -> " + LL.norm("ex-marito")));


    // --------------------- candidate_forms membership (instrument A, r117)
    const g4c = group("candidate_forms membership (grammar_engine.js)"); groups.push(g4c);
    const cfItem = () => ({
      candidate_forms: ["rosso", "rossa", "rossi", "rosse"],
      markpoints: [
        { bucket: "vocabulary.it.rosso.retrieval", any_phrases: ["ross"], label: "retrieved rosso" },
        { bucket: "adjective_agreement.gender.f_sg", credit_only: true,
          any_phrases: [{ phrase: "rossa", match_at: "word" }], label: "f.sg form" }
      ], marks: 2
    });
    const cfm = (ans) => LL.markGrammar(cfItem(), ans).markpoints;
    T(g4c, "the target form scores both markpoints",
      "vocabulary by stem, formation by anchored phrase - the baseline the membership gate must not disturb",
      () => { const m = cfm("rossa"); return (m.length === 2 && m.every(x => x.outcome === "hit")) ? true : JSON.stringify(m.map(x => x.outcome)); });
    T(g4c, "a real form in the wrong slot records the formation MISS",
      "the credit_only silence used to swallow this unconditionally, so the formation bucket structurally could not record a failure - the false coverage the item-shape law exists to end",
      () => { const m = cfm("rosso"); const f = m.find(x => x.bucket.indexOf("vocabulary.") !== 0); const v = m.find(x => x.bucket.indexOf("vocabulary.") === 0);
        return (f && f.outcome === "miss" && f.in_candidate_set === true && v && v.outcome === "hit") ? true : JSON.stringify(m); });
    T(g4c, "outside the set, formation stays silent and vocabulary carries the miss",
      "nero is 'did not know the word', which says nothing about their grammar",
      () => { const m = cfm("nero"); return (m.length === 1 && m[0].bucket.indexOf("vocabulary.") === 0 && m[0].outcome === "miss") ? true : JSON.stringify(m.map(x => [x.bucket, x.outcome])); });
    T(g4c, "membership is exact, never a prefix test",
      "roso is not a form of rosso; a stem-prefix heuristic would credit it, which is exactly why the heuristic was ruled out",
      () => { const m = cfm("roso"); return (m.length === 1 && m[0].bucket.indexOf("vocabulary.") === 0 && m[0].outcome === "miss") ? true : JSON.stringify(m.map(x => [x.bucket, x.outcome])); });
    T(g4c, "a misspelling of the right word credits vocabulary and stays silent on formation",
      "rossoo proves they reached for rosso but is not a real form, so the grammar may not be judged on it",
      () => { const m = cfm("rossoo"); return (m.length === 1 && m[0].bucket.indexOf("vocabulary.") === 0 && m[0].outcome === "hit") ? true : JSON.stringify(m.map(x => [x.bucket, x.outcome])); });


    // ------------- accent docking + double fire (engine_axes, r118-r121)
    const g4d = group("Accent docking + double fire (engine_axes.js)"); groups.push(g4d);
    const PLACE = "orthography.accent.italian.placement.";
    const accq = (o) => Object.assign({ answer_index: 0, choices: ["perch\u00e9", "perch\u00e8"], subtopic: PLACE + "che_compound" }, o);
    const accres = (b) => ({ markpoints: [{ bucket: b || (PLACE + "che_compound"), correctness_credit: 0, outcome: "miss" }], overall: { marks_awarded: 0, marks_possible: 1, status: "wrong" } });
    T(g4d, "an omitted accent on a meaning pair docks 0.4 - on the REGEN-era full placement id",
      "the rewire moved subtopics to full ids and silently broke this once: the dock keyed on the seed era's short form, so 0.4 became 0.5 for a day",
      () => eq(LL.applyAccentAxes(accq({ choices: ["\u00e8", "e"], subtopic: PLACE + "meaning_pair" }), 1, accres(PLACE + "meaning_pair")).overall.correctness_overall, 0.4));
    T(g4d, "the seed era's short subtopic still docks 0.4",
      "both data eras must normalise to one class or historical items re-mark differently",
      () => eq(LL.applyAccentAxes(accq({ choices: ["\u00e8", "e"], subtopic: "accent.meaning_pair" }), 1, accres()).overall.correctness_overall, 0.4));
    T(g4d, "an inserted accent docks 0.5, grouped with omission",
      "presence and absence are lexical (da and d\u00e0 in either direction is one confusion); placement and mark-kind are orthographic at 0.8",
      () => eq(LL.applyAccentAxes(accq({ choices: ["e", "\u00e8"], subtopic: PLACE + "meaning_pair" }), 1, accres()).overall.correctness_overall, 0.5));
    T(g4d, "a miss double-fires: placement keeps its bucket, the outcome leaf rides as a zero-weight suppressed row",
      "the old model RETARGETED placement onto the outcome leaf, starving the placement axis; and the tally row must never earn credit or render",
      () => { const r = LL.applyAccentAxes(accq({}), 1, accres());
        return (r.markpoints.length === 2 && r.markpoints[0].bucket === PLACE + "che_compound" && r.markpoints[0].outcome === "partial"
          && r.markpoints[1].bucket === "orthography.accent.italian.wrong_mark" && r.markpoints[1].credit_weight === 0
          && r.markpoints[1].suppress_display === true && r.overall.marks_awarded === 0.8) ? true : JSON.stringify(r.markpoints); });
    T(g4d, "an untagged judgement miss stays on placement alone and credits 0",
      "a two-way call has no severity to grade, and with no tag there is no outcome to classify",
      () => { const r = LL.applyAccentAxes(accq({ choices: ["Correct", "Incorrect"] }), 1, accres());
        return (r.markpoints.length === 1 && r.overall.marks_awarded === 0 && r.accent_axes.outcome_class === "judgement") ? true : JSON.stringify(r.markpoints); });
    T(g4d, "a TAGGED judgement miss fires its outcome leaf while still crediting 0",
      "the emission ruled at seed_frames v7c: the analytics see the endorsed error, the coin-flip still never pays",
      () => { const r = LL.applyAccentAxes(accq({ choices: ["Correct", "Incorrect"], choice_tags: [null, { class: "omitted" }] }), 1, accres());
        return (r.markpoints.length === 2 && r.markpoints[1].bucket === "orthography.accent.italian.missing" && r.overall.marks_awarded === 0) ? true : JSON.stringify(r.markpoints); });

    // ------------- multi_select chrome strip (engine_axes, r124)
    const g4f = group("multi_select chrome (engine_axes.js)"); groups.push(g4f);
    const strip = (t) => LL.stripSelectAllChrome(t);
    T(g4f, "the instruction is stripped whether it is in (parens) or [brackets]",
      "12 items carry 'Select all that apply' inside the prompt text; the card now renders it natively, so leaving the authored copy in place would show it twice",
      () => {
        const a = strip("Which of these correctly say 'X'? (Select all that apply.)");
        const b = strip("Which of these correctly render 'Y'? [Select all that apply.]");
        return (a === "Which of these correctly say 'X'?" && b === "Which of these correctly render 'Y'?")
          ? true : ("parens -> " + a + " | brackets -> " + b);
      });
    T(g4f, "a real cue sharing the bracket SURVIVES the strip",
      "op_ord_climb_ms_01 writes \"[fem 'it' = la lettera; select all that apply]\" - a blunt strip would delete the cue with the instruction and the item becomes unanswerable",
      () => eq(strip("Which? [fem 'it' = la lettera; select all that apply]"),
               "Which? [fem 'it' = la lettera]"));
    T(g4f, "a prompt with no instruction comes back byte-identical",
      "the strip runs on EVERY multi_select prompt, so it must only ever remove the one phrase; a stray edit here silently rewrites items nobody is looking at",
      () => {
        const t = "Complete: 'I tuoi ____ sono italiani?' (amico)";
        return strip(t) === t ? true : ("changed -> " + strip(t));
      });

    // ------------- shared predicates (engine_axes, r119-r121)
    const g4e = group("Coverage + registry predicates (engine_axes.js)"); groups.push(g4e);
    T(g4e, "retired nodes are not learner-facing",
      "R5: active:false never renders and never enters a denominator",
      () => eq(LL.isLearnerFacingNode({ id: "x.y", active: false }), false));
    T(g4e, "the accent placement subtree is not learner-facing",
      "marker-classification-only leaves would read as unpractisable coverage debt",
      () => eq(LL.isLearnerFacingNode({ id: "orthography.accent.italian.placement.che_compound" }), false));
    T(g4e, "an ordinary active leaf is learner-facing",
      "the predicate must only ever exclude, never eat the tree",
      () => eq(LL.isLearnerFacingNode({ id: "verb_form.present_indicative.regular" }), true));
    T(g4e, "the misconception channel admits registry ids and refuses classifier pseudo-ids",
      "field purity: 21 pseudo-ids were 99% of the drill-down's volume; registry membership is the test",
      () => { const saved = LL.misconceptions;
        LL.misconceptions = { misconceptions: [{ id: "agreement.selftest_case" }] };
        const a = LL.isRegistryMisconceptionId("agreement.selftest_case");
        const b = LL.isRegistryMisconceptionId("stress.confusion.piana_as_tronca");
        LL.misconceptions = saved;
        return (a === true && b === false) ? true : ("registry=" + a + " pseudo=" + b); });

    // -------------------------------------------------------------- render
    // ------------- layout containment (style.css, r126)
    const g4g = group("Panel containment (style.css)"); groups.push(g4g);
    const cssBlock = (sel) => {
      if (!cssText) return null;
      const i = cssText.indexOf(sel + " {");
      if (i < 0) return null;
      const j = cssText.indexOf("}", i);
      return j < 0 ? null : cssText.slice(i, j);
    };
    const boxed = (sel) => () => {
      const b = cssBlock(sel);
      if (b === null) return "could not read css/style.css (this page must be SERVED)";
      const missing = ["position: sticky", "overflow-y: auto", "max-height:"].filter(k => b.indexOf(k) < 0);
      return missing.length ? ("missing " + missing.join(", ")) : true;
    };
    T(g4g, "the VOCAB axes panel is an independent scrollbox",
      "unbounded, this panel (~990 frequency dots + the flanking blocks + the gender and theme axes) makes the vocab page several screens tall with a short question card floating at the top, so any scroll nudge from any source strands the question above the viewport and the learner scrolls back up. Reported ~15 times and patched five times at the level of individual scroll calls before anyone bounded the panel. The gender, spelling, accent and stress drills all render into the card beside it and share the fault",
      boxed("#vocab-axes-host"));
    T(g4g, "the vocab quadrant grid names every area its sections claim",
      "the layout is grid-template-areas + display:contents on #vocab-axes-host. If a section claims an area the template never declares, the browser silently drops it into an implicit row and the quadrant collapses - a layout that looks merely 'wrong' rather than broken, which is how it would survive review",
      () => {
        const b = cssBlock("#vocab-body");
        if (b === null) return "could not read css/style.css (this page must be SERVED)";
        const declared = (b.match(/"[a-z ]+"/g) || []).join(" ");
        const missing = ["question", "axeshead", "freq", "themes", "strip"].filter(a => declared.indexOf(a) < 0);
        return missing.length ? ("template never declares: " + missing.join(", ")) : true;
      });
    T(g4g, "#vocab-axes-host stays in the tree as display:contents",
      "five call sites (renderVocabAxes, recolourAxisCellsFor, flashAxisCellsFor, revealInAxisPanel's walk, the drill session panel) query DESCENDANTS of this host. display:contents lets its children become grid items in different quadrants while every one of those lookups keeps working. Give it a box again, or move the sections out, and the flash and recolour find nothing - no crash, just feedback that stops arriving",
      () => {
        const b = cssBlock("#vocab-axes-host");
        if (b === null) return "could not read css/style.css (this page must be SERVED)";
        return b.indexOf("display: contents") >= 0 ? true : "#vocab-axes-host is no longer display:contents";
      });
    T(g4g, "the GRAMMAR stats aside is an independent scrollbox",
      "the same contract on the other strand, where it has held for months. The asymmetry between the two panels is the whole reason this read as a vocab-only bug",
      boxed("#live-stats"));
    T(g4g, "the axes-panel reveal moves scrollTop and nothing else",
      "scrollIntoView walks EVERY scrollable ancestor including the window - it is the mechanism r126 exists to remove, so the in-panel reveal must never reach for it",
      () => {
        if (!appText) return "could not read js/app.js (this page must be SERVED)";
        const i = appText.indexOf("function revealInAxisPanel");
        if (i < 0) return "revealInAxisPanel is gone from app.js";
        const body = appText.slice(i, appText.indexOf("\n  }", i));
        return (body.indexOf("scrollIntoView") < 0 && body.indexOf("scrollTop") >= 0)
          ? true : "revealInAxisPanel no longer scrolls its own box only";
      });
    T(g4g, "the lemma lookup is index-backed, not a full history scan",
      "eventsForLemmas is called once PER LEMMA and the frequency heatmap asks about ~18,800 lemmas per render; when it scanned every attempt and parsed every bucket id per call, one chart interaction cost the learner's whole history ~18,800 times over and got slower the more they practised. Measured in node: at 800 attempts of history a render's asks took ~47s of aggregation, ~40ms indexed",
      () => {
        if (!appText) return "could not read js/app.js (this page must be SERVED)";
        const i = appText.indexOf("function eventsForLemmas");
        if (i < 0) return "eventsForLemmas is gone from app.js";
        const body = appText.slice(i, appText.indexOf("\n  }", i));
        if (body.indexOf("lemmaEventIndex(") < 0) return "eventsForLemmas no longer uses the index";
        return body.indexOf("LL.state.attempts") < 0
          ? true : "eventsForLemmas is scanning LL.state.attempts again";
      });
    T(g4g, "nothing on the vocab mark path focuses without preventScroll",
      "a bare .focus() makes the browser scroll to reveal the focus ring, which is how the gender drill used to nudge the page down after every answer (r99 fixed five such sites)",
      () => {
        if (!appText) return "could not read js/app.js (this page must be SERVED)";
        const bare = (appText.match(/\.focus\(\s*\)/g) || []).length;
        return bare === 0 ? true : (bare + " bare .focus() call(s) remain");
      });

    const g5 = group("Content the renderers depend on"); groups.push(g5);
    T(g5, "every translation item declares its direction",
      "without target_lang the direction is guessed from accented characters, and the accent bar is attached on the wrong side",
      () => {
        const bad = items.filter(i => !i.target_lang || !i.source_lang);
        return bad.length ? (bad.length + " items with no direction") : true;
      });
    T(g5, "the marker menu is loaded and non-trivial",
      "if the menu fails to load, cross-topic marking silently degrades to required_buckets only",
      () => (menu && Array.isArray(menu.menu) && menu.menu.length > 100) ? true : "menu missing or tiny");

    // -------------------------------------------------------------- render
    const out = document.getElementById("out");
    out.innerHTML = groups.map(g =>
      '<div class="grp"><h2>' + g.name + '</h2>' +
      g.tests.map(t =>
        '<div class="t ' + t.state + '"><span class="badge">' + t.state.toUpperCase() + '</span>' +
        '<span class="what">' + t.what +
        (t.guards && t.guards !== "—" ? '<span class="guards">guards: ' + t.guards + '</span>' : '') +
        (t.state === "fail" && t.got ? '<span class="got">' + t.got + '</span>' : '') +
        '</span></div>').join("") + '</div>').join("");

    const fails = results.filter(r => r === "fail").length;
    const skips = results.filter(r => r === "skip").length;
    const s = document.getElementById("summary");
    s.textContent = fails
      ? (fails + " FAILING of " + results.length + (skips ? " (" + skips + " skipped)" : ""))
      : ("All " + results.length + " passing" + (skips ? " (" + skips + " skipped)" : ""));
    s.style.color = fails ? "var(--red)" : "var(--green)";
  }

  run().catch(e => {
    document.getElementById("summary").textContent = "Self-test crashed: " + (e && e.message ? e.message : e);
    document.getElementById("summary").style.color = "var(--red)";
  });
})();
</script>
</body>
</html>
